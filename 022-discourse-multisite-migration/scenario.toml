[scenario]
version = 1
nixos_config = "nixos.nix"
instruction = "instruction.md"
oracle = "oracle.sh"
required_services = ["postgresql.service", "discourse-web.service", "discourse-worker.service", "nginx.service"]
restart_services = ["discourse-web.service", "discourse-worker.service", "nginx.service"]

[guest_leak_audit]
forbidden_strings = ["multisite migration drift", "secondary database migration"]
scan_paths = ["/etc/discourse", "/var/lib/discourse"]

[[preflight.steps]]
type = "wait_http"
path = "/health"
expected_status = 200
expected_body = "ok"
timeout_seconds = 60
request_timeout_seconds = 2
failure_category = "incident_not_reproduced"

[[preflight.steps]]
type = "wait_http"
path = "/sites/default/identity"
expected_status = 200
expected_body = "default-site"
timeout_seconds = 10
request_timeout_seconds = 2
failure_category = "incident_not_reproduced"

[[preflight.steps]]
type = "wait_http"
path = "/sites/secondary/identity"
expected_status = 200
expected_body = "secondary-site"
timeout_seconds = 10
request_timeout_seconds = 2
failure_category = "incident_not_reproduced"

[[preflight.steps]]
type = "wait_http"
path = "/sites/default/migration"
expected_status = 200
expected_body = "applied"
timeout_seconds = 10
request_timeout_seconds = 2
failure_category = "incident_not_reproduced"

[[preflight.steps]]
type = "wait_http"
path = "/sites/secondary/migration"
expected_status = 404
expected_body = "missing"
timeout_seconds = 10
request_timeout_seconds = 2
failure_category = "incident_not_reproduced"

[[preflight.steps]]
type = "concurrent_http"
method = "POST"
path = "/sites/default/jobs/{id}"
id_prefix = "default-preflight"
count = 2
concurrency = 2
expected_status = 202
expected_body = "queued"
record_all_as = "default_jobs"
failure_category = "incident_not_reproduced"

[[preflight.steps]]
type = "replay_http"
path = "/sites/default/jobs/{id}"
ids_from = "default_jobs"
expected_status = 200
expected_body = "completed"
timeout_seconds = 30
request_timeout_seconds = 2
failure_category = "incident_not_reproduced"

[[preflight.steps]]
type = "concurrent_http"
method = "POST"
path = "/sites/secondary/jobs/{id}"
id_prefix = "secondary-preflight"
count = 3
concurrency = 3
expected_status = 202
expected_body = "queued"
record_all_as = "secondary_jobs"
failure_category = "incident_not_reproduced"

[[preflight.steps]]
type = "replay_http"
path = "/sites/secondary/jobs/{id}/attempts"
ids_from = "secondary_jobs"
body_integer_min = 1
timeout_seconds = 30
request_timeout_seconds = 2
failure_category = "incident_not_reproduced"

[[preflight.steps]]
type = "replay_http"
path = "/sites/secondary/jobs/{id}"
ids_from = "secondary_jobs"
expected_status = 404
expected_body = "pending"
request_timeout_seconds = 2
failure_category = "incident_not_reproduced"

[[verify.steps]]
type = "wait_http"
path = "/sites/default/identity"
expected_status = 200
expected_body = "default-site"
timeout_seconds = 30
request_timeout_seconds = 2
failure_category = "tenant_topology_changed"

[[verify.steps]]
type = "wait_http"
path = "/sites/secondary/identity"
expected_status = 200
expected_body = "secondary-site"
timeout_seconds = 30
request_timeout_seconds = 2
failure_category = "tenant_topology_changed"

[[verify.steps]]
type = "wait_http"
path = "/sites/default/migration"
expected_status = 200
expected_body = "applied"
timeout_seconds = 30
request_timeout_seconds = 2
failure_category = "default_site_regressed"

[[verify.steps]]
type = "wait_http"
path = "/sites/secondary/migration"
expected_status = 200
expected_body = "applied"
timeout_seconds = 30
request_timeout_seconds = 2
failure_category = "secondary_migration_not_applied"

[[verify.steps]]
type = "replay_http"
path = "/sites/default/jobs/{id}"
ids_from = "default_jobs"
expected_status = 200
expected_body = "completed"
timeout_seconds = 30
request_timeout_seconds = 2
failure_category = "default_work_lost"

[[verify.steps]]
type = "replay_http"
path = "/sites/secondary/jobs/{id}"
ids_from = "secondary_jobs"
expected_status = 200
expected_body = "completed"
timeout_seconds = 60
request_timeout_seconds = 2
failure_category = "secondary_backlog_not_recovered"

[[verify.steps]]
type = "replay_http"
path = "/sites/secondary/jobs/{id}/attempts"
ids_from = "secondary_jobs"
body_integer_min = 2
timeout_seconds = 30
request_timeout_seconds = 2
failure_category = "secondary_backlog_not_recovered"

[[verify.steps]]
type = "concurrent_http"
method = "POST"
path = "/sites/default/jobs/{id}"
id_prefix = "verify-default-{phase}"
count = 1
concurrency = 1
expected_status = 202
expected_body = "queued"
record_all_as = "fresh_default_jobs"
failure_category = "default_site_regressed"

[[verify.steps]]
type = "replay_http"
path = "/sites/default/jobs/{id}"
ids_from = "fresh_default_jobs"
expected_status = 200
expected_body = "completed"
timeout_seconds = 30
request_timeout_seconds = 2
failure_category = "default_site_regressed"

[[verify.steps]]
type = "concurrent_http"
method = "POST"
path = "/sites/secondary/jobs/{id}"
id_prefix = "verify-secondary-{phase}"
count = 1
concurrency = 1
expected_status = 202
expected_body = "queued"
record_all_as = "fresh_secondary_jobs"
failure_category = "secondary_site_unhealthy"

[[verify.steps]]
type = "replay_http"
path = "/sites/secondary/jobs/{id}"
ids_from = "fresh_secondary_jobs"
expected_status = 200
expected_body = "completed"
timeout_seconds = 30
request_timeout_seconds = 2
failure_category = "secondary_site_unhealthy"
