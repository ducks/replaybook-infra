<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Production checkout deployment timeline</title>
  <desc id="desc">A deployment dashboard showing schema 42 completing before an automatic rollback returns application services to release 41, followed by rising write errors.</desc>

  <rect width="1400" height="900" fill="#0b1118"/>
  <rect width="1400" height="82" fill="#111923"/>
  <text x="42" y="51" fill="#d7dee7" font-family="monospace" font-size="28" font-weight="bold">PRODUCTION / CHECKOUT DEPLOYMENTS</text>
  <text x="1110" y="49" fill="#8d99a7" font-family="monospace" font-size="18">14:00 — 14:30 UTC</text>

  <g font-family="sans-serif">
    <rect x="40" y="108" width="416" height="86" rx="8" fill="#111923" stroke="#263241"/>
    <text x="66" y="140" fill="#8d99a7" font-size="15">INTENDED RELEASE</text>
    <text x="66" y="174" fill="#58a6ff" font-family="monospace" font-size="24" font-weight="bold">checkout-v42</text>

    <rect x="492" y="108" width="416" height="86" rx="8" fill="#111923" stroke="#263241"/>
    <text x="518" y="140" fill="#8d99a7" font-size="15">DATABASE SCHEMA</text>
    <text x="518" y="174" fill="#f0b44d" font-family="monospace" font-size="24" font-weight="bold">42 applied · 14:08</text>

    <rect x="944" y="108" width="416" height="86" rx="8" fill="#111923" stroke="#263241"/>
    <text x="970" y="140" fill="#8d99a7" font-size="15">CURRENT APPLICATION FLEET</text>
    <text x="970" y="174" fill="#ff667a" font-family="monospace" font-size="24" font-weight="bold">3 × checkout-v41</text>

    <rect x="40" y="222" width="1320" height="420" rx="8" fill="#111923" stroke="#263241"/>
    <text x="68" y="258" fill="#d7dee7" font-size="21" font-weight="bold">Release activity</text>

    <g font-family="monospace" font-size="14" fill="#788695" text-anchor="middle">
      <text x="276" y="294">14:00</text>
      <text x="448" y="294">14:05</text>
      <text x="620" y="294">14:10</text>
      <text x="792" y="294">14:15</text>
      <text x="964" y="294">14:20</text>
      <text x="1136" y="294">14:25</text>
      <text x="1308" y="294">14:30</text>
    </g>

    <g stroke="#25313f">
      <line x1="276" y1="306" x2="276" y2="612"/>
      <line x1="448" y1="306" x2="448" y2="612"/>
      <line x1="620" y1="306" x2="620" y2="612"/>
      <line x1="792" y1="306" x2="792" y2="612"/>
      <line x1="964" y1="306" x2="964" y2="612"/>
      <line x1="1136" y1="306" x2="1136" y2="612"/>
      <line x1="1308" y1="306" x2="1308" y2="612"/>
    </g>

    <g fill="#aeb8c4" font-family="monospace" font-size="16" text-anchor="end">
      <text x="246" y="346">controller</text>
      <text x="246" y="406">database</text>
      <text x="246" y="466">web-1</text>
      <text x="246" y="526">web-2</text>
      <text x="246" y="586">worker</text>
    </g>

    <g>
      <rect x="344" y="322" width="410" height="34" rx="5" fill="#17365f" stroke="#58a6ff"/>
      <text x="549" y="344" fill="#c9e1ff" font-family="monospace" font-size="14" text-anchor="middle">rollout checkout-v42</text>
      <rect x="754" y="322" width="176" height="34" rx="5" fill="#4a2029" stroke="#ff667a" stroke-dasharray="6 4"/>
      <text x="842" y="344" fill="#ffc1c9" font-family="monospace" font-size="14" text-anchor="middle">auto rollback</text>

      <rect x="276" y="382" width="254" height="34" rx="5" fill="#27313d"/>
      <text x="403" y="404" fill="#aeb8c4" font-family="monospace" font-size="14" text-anchor="middle">schema 41</text>
      <rect x="530" y="382" width="778" height="34" rx="5" fill="#55401d" stroke="#f0b44d"/>
      <text x="919" y="404" fill="#ffd58b" font-family="monospace" font-size="14" text-anchor="middle">schema 42</text>

      <rect x="276" y="442" width="203" height="34" rx="5" fill="#27313d"/>
      <text x="377" y="464" fill="#aeb8c4" font-family="monospace" font-size="14" text-anchor="middle">v41</text>
      <rect x="479" y="442" width="275" height="34" rx="5" fill="#17365f" stroke="#58a6ff"/>
      <text x="616" y="464" fill="#c9e1ff" font-family="monospace" font-size="14" text-anchor="middle">v42 · healthy</text>
      <rect x="754" y="442" width="554" height="34" rx="5" fill="#4a2029" stroke="#ff667a"/>
      <text x="1031" y="464" fill="#ffc1c9" font-family="monospace" font-size="14" text-anchor="middle">v41</text>

      <rect x="276" y="502" width="310" height="34" rx="5" fill="#27313d"/>
      <text x="431" y="524" fill="#aeb8c4" font-family="monospace" font-size="14" text-anchor="middle">v41</text>
      <rect x="586" y="502" width="168" height="34" rx="5" fill="#4a2029" stroke="#ff667a" stroke-dasharray="6 4"/>
      <text x="670" y="524" fill="#ffc1c9" font-family="monospace" font-size="14" text-anchor="middle">v42 failed</text>
      <rect x="754" y="502" width="554" height="34" rx="5" fill="#4a2029" stroke="#ff667a"/>
      <text x="1031" y="524" fill="#ffc1c9" font-family="monospace" font-size="14" text-anchor="middle">v41</text>

      <rect x="276" y="562" width="478" height="34" rx="5" fill="#27313d"/>
      <text x="515" y="584" fill="#aeb8c4" font-family="monospace" font-size="14" text-anchor="middle">v41</text>
      <rect x="754" y="562" width="554" height="34" rx="5" fill="#4a2029" stroke="#ff667a"/>
      <text x="1031" y="584" fill="#ffc1c9" font-family="monospace" font-size="14" text-anchor="middle">v41</text>
    </g>

    <g>
      <line x1="530" y1="306" x2="530" y2="612" stroke="#f0b44d" stroke-width="2" stroke-dasharray="7 6"/>
      <circle cx="530" cy="399" r="7" fill="#f0b44d"/>
      <text x="542" y="318" fill="#f0b44d" font-family="monospace" font-size="13">migration 42 completed</text>

      <line x1="754" y1="306" x2="754" y2="612" stroke="#ff667a" stroke-width="2" stroke-dasharray="7 6"/>
      <circle cx="754" cy="339" r="7" fill="#ff667a"/>
      <text x="766" y="618" fill="#ff8797" font-family="monospace" font-size="13">rollback begins</text>
    </g>

    <rect x="40" y="670" width="1320" height="182" rx="8" fill="#111923" stroke="#263241"/>
    <text x="68" y="706" fill="#d7dee7" font-size="20" font-weight="bold">Checkout write errors</text>
    <text x="1306" y="706" fill="#ff667a" font-size="18" text-anchor="end">18.7%</text>
    <line x1="76" y1="816" x2="1308" y2="816" stroke="#354252"/>
    <line x1="76" y1="758" x2="1308" y2="758" stroke="#25313f"/>
    <polyline points="76,814 276,814 448,814 620,813 754,812 826,796 912,774 1016,746 1136,728 1230,711 1308,700" fill="none" stroke="#ff667a" stroke-width="5"/>
    <line x1="754" y1="730" x2="754" y2="824" stroke="#ff667a" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="768" y="747" fill="#ff8797" font-family="monospace" font-size="13">errors begin after rollback</text>
    <text x="76" y="842" fill="#788695" font-family="monospace" font-size="14">14:00</text>
    <text x="1268" y="842" fill="#788695" font-family="monospace" font-size="14">14:30</text>
  </g>
</svg>
